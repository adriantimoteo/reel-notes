[project]
name = "personal-reel-to-notes-capture"
version = "0.1.0"
description = "Telegram bot that captures Instagram, TikTok, and YouTube Shorts into Obsidian notes via Gemini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.28.2",
    "google-genai>=2.7.0",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.3.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "pipeline", "storage", "output"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
