[project]
name = "reelkit"
version = "0.1.0"
description = "Shared building blocks for reel bots: URL detection, Instagram/TikTok/YouTube Shorts download, and Gemini multimodal extraction."
requires-python = ">=3.13"
dependencies = [
    "gallery-dl>=1.32.12",
    "google-genai>=2.7.0",
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
telegram = [
    "aiogram>=3.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
